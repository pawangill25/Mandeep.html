<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Proposal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(to bottom right,#ffc0cb,#ff4d6d);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
}

.container{
    max-width:500px;
    padding:20px;
    position:relative;
    z-index:10;
}

.bear{
    font-size:60px;
    animation:bounce 1.5s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

h1{
    font-family:'Dancing Script',cursive;
    font-size:42px;
    margin:15px 0;
    color:white;
}

.subtitle{
    font-style:italic;
    color:white;
    margin-bottom:25px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:40px;
    margin:25px 0;
}

#yesBtn{
    background:linear-gradient(45deg,#ff1e56,#ff4d6d);
    border:none;
    padding:15px 35px;
    border-radius:50px;
    font-size:18px;
    color:white;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 15px rgba(255,0,100,0.6);
    transform:scale(1);
}

#yesBtn:hover{
    box-shadow:0 0 30px rgba(255,0,100,1);
}

#noBtn{
    background:white;
    border:2px solid red;
    padding:10px 25px;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    position:relative;
}

.footer{
    color:white;
    margin-top:20px;
}

.heart{
    position:fixed;
    bottom:-20px;
    animation:floatUp linear infinite;
    opacity:0;
}

@keyframes floatUp{
    0%{transform:translateY(0);opacity:0;}
    10%{opacity:1;}
    90%{opacity:1;}
    100%{transform:translateY(-110vh);opacity:0;}
}

.celebration{
    position:fixed;
    inset:0;
    background:linear-gradient(to bottom right,#ff4d6d,#ff99ac);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    z-index:20;
}

.celebration h2{
    font-size:60px;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.2);}
}

.spin{
    font-size:50px;
    animation:spin 2s linear infinite;
}

@keyframes spin{
    100%{transform:rotate(360deg);}
}

.confetti{
    position:fixed;
    width:8px;
    height:8px;
    opacity:0.8;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(100vh) rotate(720deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8f7d73467.mp3?filename=romantic-background-112184.mp3" type="audio/mp3">
</audio>

<div class="container" id="mainContent">
    <div class="bear">🧸</div>
    <h1>Will You Be My Valentine, Mandeep?</h1>
    <div class="subtitle">I've been gathering courage to ask you this...</div>

    <div class="buttons">
        <button id="yesBtn">Yes ❤️</button>
        <button id="noBtn">No</button>
    </div>

    <div class="footer">
        Every love story is beautiful, but ours is my favourite
    </div>
</div>

<div class="celebration" id="celebration">
    <h2>Yayyyy!</h2>
    <div class="spin">💖</div>
    <p>I knew you'd say yes...</p>
</div>

<script>

const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");
const music=document.getElementById("bgMusic");
const mainContent=document.getElementById("mainContent");
const celebration=document.getElementById("celebration");

let messages=[
"Nope, not an option!",
"Try again!",
"You sure about that?",
"Not happening!",
"Think again!"
];

let messageIndex=0;
let yesScale=1;

function moveNoButton(){
    const yesRect=yesBtn.getBoundingClientRect();
    const safePadding=30;
    let x,y;

    do{
        x=Math.random()*(window.innerWidth-noBtn.offsetWidth);
        y=Math.random()*(window.innerHeight-noBtn.offsetHeight);
    }while(
        x < yesRect.right + safePadding &&
        x + noBtn.offsetWidth > yesRect.left - safePadding &&
        y < yesRect.bottom + safePadding &&
        y + noBtn.offsetHeight > yesRect.top - safePadding
    );

    noBtn.style.position="fixed";
    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";

    noBtn.innerText=messages[messageIndex];
    messageIndex=(messageIndex+1)%messages.length;

    yesScale+=0.2;
    yesBtn.style.transform=`scale(${yesScale})`;
}

noBtn.addEventListener("click",moveNoButton);
noBtn.addEventListener("touchstart",moveNoButton);

yesBtn.addEventListener("click",()=>{
    mainContent.style.display="none";
    stopHearts();
    celebration.style.display="flex";
    launchConfetti();
});

document.body.addEventListener("click",()=>{
    music.play().catch(()=>{});
},{once:true});

function createHeart(){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*20+15)+"px";
    heart.style.animationDuration=(Math.random()*5+5)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),10000);
}

let heartInterval=setInterval(()=>{
    for(let i=0;i<3;i++)createHeart();
},800);

function stopHearts(){
    clearInterval(heartInterval);
    document.querySelectorAll(".heart").forEach(h=>h.remove());
}

function launchConfetti(){
    for(let i=0;i<120;i++){
        const confetti=document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left=Math.random()*100+"vw";
        confetti.style.top="-10px";
        confetti.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`;
        confetti.style.animationDuration=(Math.random()*2+2)+"s";
        document.body.appendChild(confetti);
        setTimeout(()=>confetti.remove(),4000);
    }
}

</script>

</body>
</html>
